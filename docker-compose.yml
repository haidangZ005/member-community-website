services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: member_community_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - member_community_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d member_community_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  member_community_postgres:

